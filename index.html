<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio - 배포 테스트</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }
    .box {
      text-align: center;
      padding: 2rem 3rem;
      border-radius: 16px;
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.8rem;
    }
    p {
      margin: 0;
      color: #94a3b8;
    }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      background: #22c55e22;
      color: #22c55e;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚀 배포 성공!</h1>
    <p>이 페이지가 보인다면 GitHub Pages 배포가 잘 된 거예요.</p>
    <span class="badge">index.html is live</span>
  </div>
</body>
</html>
